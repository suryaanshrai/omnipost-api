[project]
name = "omnipost-mcp"
version = "0.1.0"
description = "MCP server for OmniPost: draft, schedule and check social posts from Claude or any MCP client."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
dependencies = ["mcp==2.3.0", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8", "anyio>=4"]

[project.scripts]
omnipost-mcp = "omnipost_mcp.server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["omnipost_mcp"]
