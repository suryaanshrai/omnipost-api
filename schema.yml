        API had no such scoping at all — any authenticated user could read or
        write any other user's rows by id.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this app credential.
        required: true
      tags:
      - app-credentials
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppCredential'
          description: ''
    put:
