      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this app credential.
        required: true
      tags:
      - app-credentials
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppCredential'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppCredential'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppCredential'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppCredential'
          description: ''
    patch:
      operationId: app_credentials_partial_update
      description: |-
        Base for any viewset whose model has a direct `workspace` FK: scopes
