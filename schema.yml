components:
  schemas:
    AIProviderEnum:
      enum:
      - anthropic
      - openai
      - gemini
      - openrouter
      type: string
      description: |-
        * `anthropic` - Anthropic
        * `openai` - OpenAI
        * `gemini` - Gemini
        * `openrouter` - OpenRouter
    AIUsage:
      type: object
      properties:
        ai_text_generation:
          $ref: '#/components/schemas/AIUsageCounter'
        ai_image_generation:
          $ref: '#/components/schemas/AIUsageCounterImage'
      required:
      - ai_image_generation
      - ai_text_generation
    AIUsageCounter:
      type: object
      properties:
        committed:
          type: integer
        reserved:
          type: integer
        limit:
          type: integer
          nullable: true
      required:
      - committed
      - limit
      - reserved
    AIUsageCounterImage:
      type: object
      properties:
        committed:
          type: integer
        reserved:
          type: integer
        limit:
          type: integer
          nullable: true
      required:
      - committed
      - limit
      - reserved
    AltTextRequest:
      type: object
      properties:
        media:
          type: integer
        provider:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/Provider4baEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - media
    AltTextResult:
      type: object
      properties:
        alt_text:
          type: string
      required:
      - alt_text
    AppCredential:
      type: object
      description: |-
        client_secret is write-only and never echoed back — unlike
        ProviderKeySerializer there's no live ping to validate it against here,
        since exercising it means actually starting an OAuth flow with the
        platform (see PublishView-adjacent oauth.py); a typo surfaces the first
        time the workspace tries to connect a channel.
      properties:
        id:
          type: integer
          readOnly: true
        workspace:
          type: integer
        connector_slug:
          type: string
          maxLength: 50
        client_id:
          type: string
          maxLength: 300
        label:
          type: string
          maxLength: 100
        created_at:
          type: string
          format: date-time
          readOnly: true
        client_secret:
          type: string
          writeOnly: true
      required:
      - client_id
      - client_secret
      - connector_slug
      - created_at
      - id
      - workspace
    AspectEnum:
      enum:
      - square_1x1
      - portrait_4x5
      - vertical_9x16
      - landscape_16x9
      type: string
      description: |-
        * `square_1x1` - square_1x1
        * `portrait_4x5` - portrait_4x5
        * `vertical_9x16` - vertical_9x16
        * `landscape_16x9` - landscape_16x9
    BestTime:
      type: object
      description: |-
        Read-only shape of one services.best_times.Suggestion — backs
        GET /channels/{id}/best-times/.
      properties:
        weekday:
          type: integer
        hour:
          type: integer
        sample_size:
          type: integer
        avg_engagement:
          type: number
          format: double
      required:
      - avg_engagement
      - hour
      - sample_size
      - weekday
    BlackoutWindow:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        workspace:
          type: integer
        channel:
          type: integer
          nullable: true
        label:
          type: string
          maxLength: 200
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        is_active:
          type: boolean
      required:
      - ends_at
      - id
      - starts_at
      - workspace
    BlankEnum:
      enum:
      - ''
    Channel:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        workspace:
          type: integer
        connector_slug:
          type: string
          maxLength: 50
        display_name:
          type: string
          maxLength: 200
        external_account_id:
          type: string
          maxLength: 200
        health:
          allOf:
          - $ref: '#/components/schemas/ChannelHealthEnum'
          readOnly: true
        health_detail:
          type: string
          readOnly: true
        token_expires_at:
          type: string
          format: date-time
          nullable: true
        refresh_token_expires_at:
          type: string
          format: date-time
          nullable: true
        timezone:
          type: string
          maxLength: 64
        min_gap_minutes:
          type: integer
          maximum: 2147483647
          minimum: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        credentials:
          type: object
          additionalProperties:
            type: string
          writeOnly: true
      required:
      - connector_slug
      - created_at
      - display_name
      - health
      - health_detail
      - id
      - workspace
    ChannelHealthEnum:
      enum:
      - healthy
      - needs_attention
      - broken
      type: string
      description: |-
        * `healthy` - Healthy
        * `needs_attention` - Needs attention
        * `broken` - Broken
    Connector:
      type: object
      description: |-
        Read-only view of one connectors.registry entry: its slug plus the
        capability/gating facts the frontend needs and can't otherwise discover
        (see GET /connectors/ in views.py).
      properties:
        slug:
          type: string
        display_name:
          type: string
        requires_own_app:
          type: boolean
        supports_oauth:
          type: boolean
        credential_fields:
          type: array
          items:
            type: string
        oauth_extra_fields:
          type: array
          items:
            type: string
        max_text_length:
          type: integer
          nullable: true
        supports_link:
          type: boolean
        supports_alt_text:
          type: boolean
        supports_threads:
          type: boolean
        supports_scheduling_native:
          type: boolean
        post_kinds:
          type: array
          items:
            type: string
        media:
          type: array
          items:
            $ref: '#/components/schemas/MediaRule'
      required:
      - credential_fields
      - display_name
      - max_text_length
      - media
      - oauth_extra_fields
      - post_kinds
      - requires_own_app
      - slug
      - supports_alt_text
      - supports_link
      - supports_oauth
      - supports_scheduling_native
      - supports_threads
    GenerateImageRequest:
      type: object
      properties:
        workspace:
          type: integer
        prompt:
          type: string
        aspect:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/AspectEnum'
          - $ref: '#/components/schemas/NullEnum'
        provider:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/Provider4baEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - prompt
      - workspace
    GenerateVariantsRequest:
      type: object
      properties:
        workspace:
          type: integer
        brief:
          type: string
        channels:
          type: array
          items:
            type: integer
        voice_profile:
          type: integer
          nullable: true
        provider:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/Provider4baEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - brief
      - channels
      - workspace
    GenerateVariantsResult:
      type: object
      properties:
        variants:
          type: array
          items:
            $ref: '#/components/schemas/GeneratedVariant'
      required:
      - variants
    GeneratedVariant:
      type: object
      properties:
        channel:
          type: integer
        text:
          type: string
        findings:
          type: array
          items:
            $ref: '#/components/schemas/ValidateFinding'
      required:
      - channel
      - findings
      - text
    ImportCsvRequest:
      type: object
      properties:
        workspace:
          type: integer
        file:
          type: string
          format: uri
        csv_text:
          type: string
      required:
      - workspace
    ImportCsvResult:
      type: object
      properties:
        created:
          type: integer
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ImportCsvRowError'
      required:
      - created
      - errors
    ImportCsvRowError:
      type: object
      properties:
        row:
          type: integer
        detail: {}
      required:
      - detail
      - row
    Login:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - password
    MediaAsset:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        workspace:
          type: integer
        file:
          type: string
          format: uri
        kind:
          $ref: '#/components/schemas/MediaKindEnum'
        mime_type:
          type: string
          readOnly: true
        size_bytes:
          type: integer
          readOnly: true
          nullable: true
        width:
          type: integer
          readOnly: true
          nullable: true
        height:
          type: integer
          readOnly: true
          nullable: true
        duration_s:
          type: number
          format: double
          readOnly: true
          nullable: true
        alt_text:
          type: string
          maxLength: 1000
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - duration_s
      - file
      - height
      - id
      - kind
      - mime_type
      - size_bytes
      - width
      - workspace
    MediaKindEnum:
      enum:
      - image
      - video
      - gif
      type: string
      description: |-
        * `image` - Image
        * `video` - Video
        * `gif` - GIF
    MediaRule:
      type: object
      description: |-
        Read-only view of connectors.capabilities.MediaRule — not a
        ModelSerializer, since Capabilities lives in code (connectors/*), not the
        database. Backs GET /connectors/, so the frontend's composer and Connect
        modal validate against the same rules Connector.validate() enforces
        server-side, instead of a hand-maintained table drifting out of sync.
      properties:
        kinds:
          type: array
          items:
            type: string
        max_count:
          type: integer
        max_size_mb:
          type: number
          format: double
          nullable: true
        max_duration_s:
          type: number
          format: double
          nullable: true
        min_duration_s:
          type: number
          format: double
          nullable: true
        allowed_aspect_ratios:
          type: array
          items:
            type: string
        allowed_mime_types:
          type: array
          items:
            type: string
      required:
      - allowed_aspect_ratios
      - allowed_mime_types
      - kinds
      - max_count
      - max_duration_s
      - max_size_mb
      - min_duration_s
    Membership:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        workspace:
          type: integer
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        role:
          $ref: '#/components/schemas/RoleEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - user
      - workspace
    NullEnum:
      enum:
      - null
    OAuthCompleteRequest:
      type: object
      properties:
        connector_slug:
          type: string
        code:
          type: string
        redirect_uri:
          type: string
        state:
          type: string
      required:
      - code
      - connector_slug
      - redirect_uri
      - state
    OAuthStartRequest:
      type: object
      properties:
        connector_slug:
          type: string
        workspace:
          type: integer
        display_name:
          type: string
        redirect_uri:
          type: string
        extra: {}
      required:
      - connector_slug
      - redirect_uri
      - workspace
    OAuthStartResult:
      type: object
      properties:
        authorize_url:
          type: string
        provider_state:
          type: string
      required:
      - authorize_url
      - provider_state
    PaginatedAppCredentialList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/AppCredential'
    PaginatedBestTimeList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/BestTime'
    PaginatedBlackoutWindowList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
