        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAppCredential'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAppCredential'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAppCredential'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppCredential'
          description: ''
    delete:
      operationId: app_credentials_destroy
      description: |-
        Base for any viewset whose model has a direct `workspace` FK: scopes
        the queryset to workspaces the requesting user is a member of. The old
        API had no such scoping at all — any authenticated user could read or
        write any other user's rows by id.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
