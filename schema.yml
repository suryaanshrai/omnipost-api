openapi: 3.0.3
info:
  title: OmniPost
  version: 1.0.0
  description: REST API for the OmniPost project
paths:
  /ai/alt-text/:
    post:
      operationId: ai_alt_text_create
      description: |-
        POST {media, provider?} -> {alt_text}. Also writes the result onto
        MediaAsset.alt_text so the composer picks it up immediately.
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AltTextRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AltTextRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AltTextRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AltTextResult'
          description: ''
  /ai/images/:
    post:
      operationId: ai_images_create
      description: POST {workspace, prompt, aspect?, provider?} -> the created MediaAsset.
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateImageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GenerateImageRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GenerateImageRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
          description: ''
  /ai/repurpose/:
    post:
      operationId: ai_repurpose_create
      description: |-
        POST {workspace, source_text | source_url, target_formats: [str...],
        voice_profile?, provider?} -> {results: {format: text}}.
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepurposeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RepurposeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RepurposeRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepurposeResult'
          description: ''
  /ai/usage/:
    get:
      operationId: ai_usage_retrieve
      description: GET ?workspace=<id> -> current AI quota usage, for a usage badge.
      parameters:
      - in: query
        name: workspace
        schema:
          type: integer
        required: true
      tags:
      - ai
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIUsage'
          description: ''
  /ai/variants/:
    post:
      operationId: ai_variants_create
      description: |-
        POST {workspace, brief, channels: [id...], voice_profile?, provider?}
        -> {variants: [{channel, text, findings}]}. One brief, one LLM call,
        one native variant per requested channel — the differentiator feature
        from the plan, not N separate "generate a caption" calls.
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateVariantsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GenerateVariantsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GenerateVariantsRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateVariantsResult'
          description: ''
  /app-credentials/:
    get:
      operationId: app_credentials_list
      description: |-
        Base for any viewset whose model has a direct `workspace` FK: scopes
        the queryset to workspaces the requesting user is a member of. The old
        API had no such scoping at all — any authenticated user could read or
        write any other user's rows by id.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - app-credentials
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAppCredentialList'
          description: ''
    post:
      operationId: app_credentials_create
      description: |-
        Base for any viewset whose model has a direct `workspace` FK: scopes
        the queryset to workspaces the requesting user is a member of. The old
        API had no such scoping at all — any authenticated user could read or
        write any other user's rows by id.
      tags:
      - app-credentials
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppCredential'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppCredential'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppCredential'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppCredential'
          description: ''
